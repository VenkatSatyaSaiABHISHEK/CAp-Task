services:
  - type: web
    name: water-tank-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        value: pg-33c86bd8-water-level.f.aivencloud.com
      - key: DB_PORT
        value: 24446
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: FRONTEND_URL
        value: https://water-tank-frontend.onrender.com

  - type: web
    name: water-tank-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://water-tank-backend.onrender.com

  - type: pserv
    name: water-tank-db
    plan: free
    ipAllowList: [] # Allow all IPs or specify your backend IP
