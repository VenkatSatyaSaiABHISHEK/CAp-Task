services:
  - type: web
    name: water-tank-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        value: YOUR_DB_HOST
      - key: DB_PORT
        value: YOUR_DB_PORT
      - key: DB_NAME
        value: YOUR_DB_NAME
      - key: DB_USER
        value: YOUR_DB_USER
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: FRONTEND_URL
        value: https://your-frontend-url.onrender.com

  - type: web
    name: water-tank-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://your-backend-url.onrender.com

  - type: pserv
    name: water-tank-db
    plan: free
    ipAllowList: [] # Allow all IPs or specify your backend IP
